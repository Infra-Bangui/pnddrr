services:
  pnddrr:
    image: ghcr.io/infra-bangui/pnddrr:latest
    container_name: pnddrr
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      NODE_OPTIONS: "--max-old-space-size=1536"
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PNDDRR_DEMO: ${PNDDRR_DEMO:-0}
      PNDDRR_SECURE_COOKIE: ${PNDDRR_SECURE_COOKIE:-0}
    volumes:
      - pnddrr-data:/data
    mem_limit: 2g
    memswap_limit: 2g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pnddrr-data:
